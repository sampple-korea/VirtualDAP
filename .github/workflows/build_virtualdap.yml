name: Build and verify VirtualDAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: virtualdap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-app:
    name: Host app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install DSP native toolchain
        run: yes | sdkmanager "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Verify host app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify product output boundary
        run: python3 scripts/verify_product_boundary.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify container PCM transport
        run: bash scripts/verify_container_transport.sh
      - name: Verify consumer engine adaptations
        run: python3 scripts/verify_container_sources.py
      - name: Verify DSP and retained compatibility transport
        run: bash scripts/verify_dsp.sh
      - name: Upload debug APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: virtualdap-host-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            test_apps/music_fixture/build/outputs/apk/debug/musicFixture-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

  consumer-runtime:
    name: Ordinary-UID runtime (API ${{ matrix.api }})
    needs: host-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: virtualdap-host-debug
          path: built
      - name: Enable runner KVM for the test emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Test installed consumer APK without root
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: |
            adb unroot
            adb wait-for-device
            adb shell id
            adb install -r built/app/build/outputs/apk/debug/app-debug.apk
            adb install -r built/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.virtualdap.host.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            cat instrumentation.txt
            grep -Eq '^OK \([1-9][0-9]* tests?\)\r?$' instrumentation.txt
            ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' instrumentation.txt
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualdap-runtime-api-${{ matrix.api }}
          path: instrumentation.txt
          if-no-files-found: warn
