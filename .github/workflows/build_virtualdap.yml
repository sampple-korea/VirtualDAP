name: Build and verify VirtualDAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: virtualdap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-app:
    name: Host app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Verify host app
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: virtualdap-host-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*

  guest-bridge:
    name: Android 13 guest bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: yes | sdkmanager "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Verify transport, ABI builds, HAL and policy
        run: scripts/verify_guest.sh
      - name: Package Android 13 guest integration kit
        run: |
          mkdir -p out
          tar --exclude='guest_os/build-*' -czf out/virtualdap-android13-guest-kit.tar.gz guest_os docs/GUEST_ANDROID_13.md
      - name: Upload guest integration kit
        uses: actions/upload-artifact@v4
        with:
          name: virtualdap-android13-guest-kit
          if-no-files-found: error
          path: out/virtualdap-android13-guest-kit.tar.gz
